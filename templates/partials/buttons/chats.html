{% load i18n %}
<a href="{% url 'chat_room' %}"
   class="flex items-center gap-2 px-3 py-2 text-white hover:text-indigo-600 rd-xl transition-all duration-200 group relative">

    <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-6 h-6 mt-1 transition-transform group-hover:scale-110"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
        </svg>

        <span class="absolute -top-1 -right-1 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rd-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rd-full h-3 w-3 bg-emerald-500 b-1 b-slate-900/10"></span>
        </span>
    </div>

    <span class="font-500 text-sm">{% trans "Chat Room" %}</span>

    <span class="animate-pulse bg-emerald-100 text-emerald-600 px-1.5 py-0.5 rd-full text-[10px] font-800">
        LIVE
    </span>
</a>
