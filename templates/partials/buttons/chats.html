{% load i18n %}
<div x-data="{ subMenuOpen: false }" class="w-full">
    <a @click.stop="subMenuOpen = !subMenuOpen"
            class="w-full flex items-center justify-between gap-2 px-3 py-2.5 text-slate-300 hover:text-white hover:bg-white/5 rd-lg transition-all group cursor-pointer">

        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <span class="text-sm font-500">{% trans "Chats" %}</span>
        </div>

        <svg class="w-3 h-3 transition-transform duration-300" :class="subMenuOpen ? 'rotate-180' : '-rotate-90'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

    <div x-show="subMenuOpen"
         x-collapse
         class="mt-1 ml-4 pl-2 border-l border-white/10 space-y-1">

        <a href="{% url 'chat_room' %}" class="flex items-center justify-between p-2 rd-lg hover:bg-white/5 transition-colors group">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rd-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rd-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-xs text-slate-400 group-hover:text-emerald-400 transition-colors">{% trans "Public Room" %}</span>
            </div>
        </a>

        {% for group in user.chat_groups.all %}
            {% if group.is_private %}
                <a href="{% url 'private_chat_room' group.group_name %}"
                   class="flex items-center gap-2 p-2 rd-lg hover:bg-white/5 transition-colors group">
                    {% for member in group.members.all %}
                        {% if member != user %}
                            <div class="w-5 h-5 rd-md bg-white/5 flex items-center justify-center shrink-0">
                                <img class="w-full h-full rd-full" alt="user avatar" src="{{ member.profile.avatar_url }}">
                            </div>
                            <span class="text-xs text-slate-400 group-hover:text-white truncate">
                                    {{ member.username }}
                            </span>
                        {% endif %}
                    {% endfor %}
                </a>
            {% endif %}
        {% endfor %}
    </div>
</div>
